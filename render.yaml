services:
  - type: web
    name: finflow-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    rootDir: server
    buildCommand: npm install && node scripts/prepare-db.js --push && npm run build
    startCommand: node scripts/prepare-db.js && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      # For 100% permanent data persistence on free cloud hosts (Render/Railway),
      # set DATABASE_URL to a free cloud PostgreSQL URI (e.g. from Supabase or Neon.tech):
      # e.g.: postgresql://postgres:password@ep-cool-fog-12345.neon.tech/finflow?sslmode=require
      # If left as file:./data/finflow.db, FinFlow will use local SQLite.
      - key: DATABASE_URL
        value: file:./data/finflow.db
      # Persistent JWT secret so user sessions survive redeployments and restarts
      - key: JWT_SECRET
        value: finflow_production_jwt_secret_token_secure_permanent_key_2026
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads
